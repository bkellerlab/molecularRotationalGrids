grid:
  unique_network_name: "graphene_very_large"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 272
  translation_algorithm: "cartesian"
  periodic_in: [True, True, False]
  translation_subgrids_A: [ [None, None, 10], [ None, None, 10], [1.5, 10, 20] ]

pseudotrajectory:
  molecule_1: "graphene"
  molecule_2: "xylene"
  structure_ending: "gro"
  trajectory_ending: "xtc"

analysis:
  energy_program: GROMACS
  zoom_level: 8
  view_index: [1, 4]
  energy_types: ["Coul-SR:MOL1-MOL2", "LJ-SR:MOL1-MOL2"]

msm:
  taus: [1, 2, 3, 5, 10, 20, 30, 50, 100, 200, 300, 500, 1000]

sqra:
  cutting_factor: "auto"
  tolerance_rate_matrix_row_sum: 1e-12
  sigma: 0
  tolerance_eigendecomposition: 0

eigenvectors:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 12
  num_extremes_to_plot: "auto"