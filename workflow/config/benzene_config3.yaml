grid:
  unique_network_name: "162_sph_272rot_sym"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 272
  periodic_in: [ False, False ]
  translation_algorithm: "spherical"
  translation_subgrids_A: [ 162, [1.5, 10, 10] ]


pseudotrajectory:
  molecule_1: "benzene"
  molecule_2: "benzene"
  structure_ending: "gro"
  trajectory_ending: "xtc"

analysis:
  energy_program: "GROMACS"
  view_index: [1]
  length_shortened_trajectory_ns: 10
  energy_types: ["LJ (SR)", "Coulomb (SR)"]
  upper_E_limit: 0
  analyse_first_N_frames: None
  parts_to_perform: ["plot_lowest_energies", "sqra"]#["plot_lowest_energies", "sqra"]



curta:
  num_batches: 50
  num_structures_per_batch: 400

sqra:
  #capping_factor: 3000
  cutting_factor: "auto"
  #tolerance_rate_matrix_row_sum: 1e-10
  sigma: 0
  tolerance_eigendecomposition: 0
  translational_diffusion_coefficient: [ 100.0, 100.0, 100.0 ] # A^2/ns
  rotational_diffusion_coefficient: [217.0, 217.0, 217.0] # /ns

eigenvectors:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 12
  num_extremes_to_plot: 3