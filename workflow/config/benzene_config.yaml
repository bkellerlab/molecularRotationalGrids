grid:
  unique_network_name: "40_sph_50rot"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 50
  periodic_in: [ False, False ]
  translation_algorithm: "spherical"
  translation_subgrids_A: [ 40, [1, 6, 10] ]

pseudotrajectory:
  molecule_1: "benzene2"
  molecule_2: "benzene2"
  structure_ending: "xyz"
  trajectory_ending: "xyz"

analysis:
  energy_program: "ORCA"
  view_index: [2 ]
  length_shortened_trajectory_ns: 10
  energy_types: ["LJ (SR)", "Coulomb (SR)"]
  upper_E_limit: 0
  analyse_first_N_frames: None
  parts_to_perform: ["plot_lowest_energies", "sqra"]#["plot_lowest_energies", "sqra"]


curta:
  num_batches: 50
  num_structures_per_batch: 400

sqra:
  #capping_factor: 3000
  cutting_factor: 1e8
  #tolerance_rate_matrix_row_sum: 1e-10
  sigma: 0
  tolerance_eigendecomposition: 0
  diffusion_coefficient: 54.9 # A^2/ns

eigenvectors:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 12
  num_extremes_to_plot: 3